name: Android CI

on: [push, pull_request]

jobs:
  build-dev-debug:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # One debug key for every run: without it each runner signs with a fresh random key and a newer build
    # cannot be installed over an older one.
    - name: Reuse debug keystore
      uses: actions/cache@v4
      with:
        path: ~/.android/debug.keystore
        key: android-debug-keystore-v1

    - name: Stereo Spatialization tests
      run: >-
        ./gradlew testDevDebugUnitTest
        --tests 'com.music.bitchord.playback.spatializer.*'
        --tests 'com.music.bitchord.playback.audio.PrecisionAudioSinkTest'

    # arm64-v8a only (Galaxy S21 and every other 64-bit ARM phone): one APK to download instead of every split.
    # appIdSuffix: installs beside the official BitChord (different package + name) instead of clashing with it.
    - name: Build Dev Debug APK
      run: ./gradlew assembleDevDebug -Pabis=arm64-v8a -PappIdSuffix=.v3

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-dev-debug-arm64-v8a
        path: app/build/outputs/apk/dev/debug/*arm64-v8a*.apk
        if-no-files-found: error

  build-prod-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
        echo "storeFile=bitchord-release.jks" > keystore.properties
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease -Pabis=arm64-v8a -PappIdSuffix=.v3

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed-arm64-v8a
        path: app/build/outputs/apk/prod/release/*arm64-v8a*.apk
        if-no-files-found: error
